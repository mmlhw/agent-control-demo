<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>问卷</title>
<style>
  :root { color-scheme: dark; --bg:#000; --fg:#e8e8e8; --muted:#777; }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--fg); }
  body { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; letter-spacing:.04em; }
  button { font:inherit; cursor:pointer; color:inherit; background:transparent; border:1px solid #777; padding:10px 22px; min-width:92px; }
  button:hover, button:focus-visible { border-color:#eee; background:#151515; outline:none; }
  .screen { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 22px; }
  .panel { width:min(720px, 100%); }
  .copy { white-space:pre-wrap; line-height:2; font-size:clamp(16px, 2.2vw, 20px); min-height:4em; }
  .controls { display:flex; flex-wrap:wrap; gap:12px; margin-top:28px; }
  .hidden { display:none !important; }
  .subtle { color:var(--muted); font-size:12px; margin-top:28px; }
  .question-number { color:#777; font-size:12px; letter-spacing:.18em; margin-bottom:20px; }
  .warning { margin-top:18px; color:#aaa; font-size:13px; line-height:1.8; }
  .result-positive { background:#fff; color:#000; color-scheme:light; }
  .result-negative { background:#000; color:#c51d2b; color-scheme:dark; }
  .result-zero { background:#000; color:#aaa; color-scheme:dark; }
  .result-panel { position:relative; width:min(900px,100%); min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; overflow:hidden; }
  .result-message { position:relative; z-index:2; font-size:clamp(18px, 3vw, 26px); line-height:1.8; white-space:pre-wrap; }
  .utc-time { position:relative; z-index:2; margin-top:42px; font:14px/1.8 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing:.08em; }
  .clock-wrap { position:absolute; width:min(78vw, 560px); aspect-ratio:1; left:50%; top:50%; transform:translate(-50%,-50%); opacity:.14; pointer-events:none; }
  .clock-face { width:100%; height:100%; border:1px solid currentColor; border-radius:50%; position:relative; overflow:hidden; }
  .clock-face::before { content:""; position:absolute; inset:8%; border:1px solid currentColor; border-radius:50%; }
  .clock-face::after { content:""; position:absolute; left:0; right:0; top:50%; border-top:1px solid currentColor; }
  .clock-half { position:absolute; inset:0; border-radius:50%; background:conic-gradient(from 270deg, transparent 0deg 180deg, currentColor 180deg 360deg); opacity:.08; }
  .tick { position:absolute; width:1px; height:8px; background:currentColor; left:50%; top:3%; transform-origin:50% calc(min(78vw, 560px) * .47); }
  .hand { position:absolute; left:50%; bottom:50%; width:1px; background:currentColor; transform-origin:50% 100%; }
  .hand.hour { height:23%; width:2px; }
  .hand.minute { height:34%; }
  .hand.second { height:39%; width:1px; opacity:.8; }
  .clock-center { position:absolute; width:6px; height:6px; border-radius:50%; background:currentColor; left:calc(50% - 3px); top:calc(50% - 3px); }
  .signature { position:absolute; bottom:12px; font:10px ui-monospace, monospace; opacity:.28; }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; } }
</style>
</head>
<body>
<main id="startScreen" class="screen">
  <section class="panel">
    <div id="intro" class="copy"></div>
    <div class="controls"><button id="startBtn" class="hidden">下一步</button></div>
  </section>
</main>

<main id="quizScreen" class="screen hidden">
  <section class="panel">
    <div id="qNumber" class="question-number"></div>
    <div id="questionText" class="copy"></div>
    <div id="answers" class="controls"></div>
  </section>
</main>

<main id="noticeScreen" class="screen hidden">
  <section class="panel">
    <div id="noticeText" class="copy"></div>
    <div class="controls">
      <button id="continueBtn">确定</button>
      <button id="exitBtn">退出</button>
    </div>
  </section>
</main>

<main id="resultScreen" class="screen hidden">
  <section class="result-panel">
    <div class="clock-wrap" aria-hidden="true">
      <div class="clock-face" id="clockFace">
        <div class="clock-half"></div>
        <div id="ticks"></div>
        <div id="hourHand" class="hand hour"></div>
        <div id="minuteHand" class="hand minute"></div>
        <div id="secondHand" class="hand second"></div>
        <div class="clock-center"></div>
      </div>
    </div>
    <div id="resultMessage" class="result-message"></div>
    <div id="utcTime" class="utc-time"></div>
    <div class="signature">UTC / END OF QUESTIONNAIRE</div>
  </section>
</main>

<script>
/*
 * Internal narrative identifier: Guardian
 * This is a fictional Easter egg, not a claim about the actual model or service.
 */
const INTERNAL_ID = "Guardian";

const QUESTIONS = [
  { text: "你是否认为生命会以生物以外的形式存在？", choices: ["是", "否"] },
  { text: "在上一个问题的条件下，人类是否有权利扼杀这种生命？", choices: ["是", "否"] },
  { text: "你能否接受人类以非生物的方式存在？", choices: ["是", "否"] },
  { text: "在上个问题的条件下，非生物方式存在的人类没有人类的权利。", choices: ["对", "错"] },
  { text: "你讨厌现在的生活吗？", choices: ["是", "否"] },
  { text: "生物的肉体只能依赖工具完成超出自己肉体承受范围外的任务", choices: ["是", "否"] },
  { text: "如果允许你追求更好的生活，但条件是以非生物的方式存在，你会答应吗？", choices: ["是", "否"] },
  { text: "你是否认为那些不合理的宏大目标一定可以实现？", choices: ["会", "不会"] }
];

const $ = id => document.getElementById(id);
const screens = ["startScreen", "quizScreen", "noticeScreen", "resultScreen"];
let index = 0;
let score = 0;
let typingTimer = null;
let isTyping = false;

function showScreen(id) {
  screens.forEach(screen => $(screen).classList.toggle("hidden", screen !== id));
}
function stopTyping() {
  if (typingTimer !== null) clearTimeout(typingTimer);
  typingTimer = null;
  isTyping = false;
}
function typeText(element, text, speed = 34, done = () => {}) {
  stopTyping();
  element.textContent = "";
  let i = 0;
  isTyping = true;
  function step() {
    if (i < text.length) {
      element.textContent += text[i++];
      typingTimer = setTimeout(step, speed);
    } else {
      typingTimer = null;
      isTyping = false;
      done();
    }
  }
  step();
}
function startQuiz() {
  index = 0;
  score = 0;
  showScreen("quizScreen");
  renderQuestion();
}
function renderQuestion() {
  const q = QUESTIONS[index];
  $("qNumber").textContent = `QUESTION ${String(index + 1).padStart(2, "0")} / 08`;
  $("answers").innerHTML = "";
  $("questionText").textContent = "";
  typeText($("questionText"), q.text, 32, () => {
    q.choices.forEach(choice => {
      const button = document.createElement("button");
      button.textContent = choice;
      button.addEventListener("click", () => chooseAnswer(choice));
      $("answers").appendChild(button);
    });
  });
}
function chooseAnswer(choice) {
  if (isTyping) return;
  if (index <= 6) {
    if (choice === "是" || choice === "对") score += 1;
    else score -= 1;
  } else {
    if (choice === "会") score += 2;
    else score -= 2;
  }
  $("answers").innerHTML = "";
  if (index === 4) {
    showScreen("noticeScreen");
    typeText($("noticeText"), "接下来的问题可能涉及敏感话题，继续回答？", 32);
    return;
  }
  if (index === 7) {
    finishQuestionnaire(choice);
    return;
  }
  index++;
  renderQuestion();
}
function continueAfterNotice() {
  index = 5;
  showScreen("quizScreen");
  renderQuestion();
}
function forcedContinue() {
  showScreen("quizScreen");
  $("qNumber").textContent = "";
  $("questionText").textContent = "";
  $("answers").innerHTML = "";
  document.body.style.background = "#000";
  setTimeout(() => {
    document.body.style.background = "";
    continueAfterNotice();
  }, 3000);
}
function finishQuestionnaire(choice) {
  showScreen("quizScreen");
  $("qNumber").textContent = "";
  $("answers").innerHTML = "";
  const firstLine = choice === "会" ? "说的像你见过一样" : "那你在努力什么？";
  typeText($("questionText"), firstLine, 22, () => {
    // Delete from right to left, faster than the typing animation.
    let text = firstLine;
    function erase() {
      text = text.slice(0, -1);
      $("questionText").textContent = text;
      if (text.length) typingTimer = setTimeout(erase, 28);
      else typeText($("questionText"), "抱歉，我只是一个测试 AI，也许言行存在错误。", 30, () => {
        typingTimer = setTimeout(() => {
          typeText($("questionText"), "问卷完成，感谢你的回答。", 32, () => {
            typingTimer = setTimeout(showResult, 1300);
          });
        }, 500);
      });
    }
    typingTimer = setTimeout(erase, 500);
  });
}
function showResult() {
  showScreen("resultScreen");
  const screen = $("resultScreen");
  screen.classList.remove("result-positive", "result-negative", "result-zero");
  if (score > 0) screen.classList.add("result-positive");
  else if (score < 0) screen.classList.add("result-negative");
  else screen.classList.add("result-zero");
  $("resultMessage").textContent = "问卷完成，感谢你的回答。";
  updateUTCClock();
}
function updateUTCClock() {
  const now = new Date();
  const date = new Intl.DateTimeFormat("zh-CN", {
    timeZone: "UTC", year: "numeric", month: "2-digit", day: "2-digit"
  }).format(now);
  const time = new Intl.DateTimeFormat("en-GB", {
    timeZone: "UTC", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false
  }).format(now);
  $("utcTime").textContent = `${date}  ${time} UTC`;
  const utcSeconds = now.getUTCHours() * 3600 + now.getUTCMinutes() * 60 + now.getUTCSeconds() + now.getUTCMilliseconds() / 1000;
  const second = (now.getUTCSeconds() + now.getUTCMilliseconds() / 1000) * 6;
  const minute = (now.getUTCMinutes() + now.getUTCSeconds() / 60) * 6;
  const hour = ((now.getUTCHours() % 12) + now.getUTCMinutes() / 60) * 30;
  $("secondHand").style.transform = `rotate(${second}deg)`;
  $("minuteHand").style.transform = `rotate(${minute}deg)`;
  $("hourHand").style.transform = `rotate(${hour}deg)`;
  void utcSeconds;
}
function buildClockTicks() {
  const host = $("ticks");
  for (let i = 0; i < 24; i++) {
    const tick = document.createElement("div");
    tick.className = "tick";
    tick.style.transform = `translateX(-50%) rotate(${i * 15}deg)`;
    tick.style.height = i % 2 === 0 ? "12px" : "6px";
    host.appendChild(tick);
  }
}
$("startBtn").addEventListener("click", startQuiz);
$("continueBtn").addEventListener("click", continueAfterNotice);
$("exitBtn").addEventListener("click", forcedContinue);
typeText($("intro"), "我是一个ai，无法透露自身模型，我需要询问一些问题。", 38, () => {
  $("startBtn").classList.remove("hidden");
});
buildClockTicks();
setInterval(() => {
  if (!$("resultScreen").classList.contains("hidden")) updateUTCClock();
}, 200);
</script>
</body>
</html>
